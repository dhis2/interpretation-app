name: 'dhis2: verify (app)'

on:
    push:
        branches:

env:
    GIT_AUTHOR_NAME: '@dhis2-bot'
    GIT_AUTHOR_EMAIL: 'apps@dhis2.org'
    GIT_COMMITTER_NAME: '@dhis2-bot'
    GIT_COMMITTER_EMAIL: 'apps@dhis2.org'
    GH_TOKEN: ${{secrets.DHIS2_BOT_GITHUB_TOKEN}}
    CI: true

jobs:
    install:
        runs-on: ubuntu-latest
        if: "!contains(github.event.head_commit.message, '[skip ci]')"

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20.x

            - uses: actions/cache@v4
              id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

            - name: Install
              if: steps.yarn-cache.outputs.cache-hit != 'true'
              run: yarn install --frozen-lockfile

    build:
        runs-on: ubuntu-latest
        needs: install
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20.x

            - uses: actions/cache@v4
              id: yarn-cache
              with:
                  path: '**/node_modules'
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}

            - name: Build
              run: yarn build

            - uses: actions/upload-artifact@v4
              with:
                  name: app-build
                  path: |
                      **/build
                      !**/node_modules
                  retention-days: 1
    publish:
        runs-on: ubuntu-latest
        needs: [build]
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{env.GH_TOKEN}}

            - uses: actions/setup-node@v4
              with:
                  node-version: 20.x

            - uses: actions/download-artifact@v4
              with:
                  name: app-build

            # Retry publish to handle concurrent updates to the artifact branch.
            - name: Publish build (attempt 1)
              id: publish_attempt_1
              continue-on-error: true
              uses: dhis2/deploy-build@v1.18.4
              with:
                  build-dir: build
                  github-token: ${{ env.GH_TOKEN }}

            - name: Wait before retry
              if: steps.publish_attempt_1.outcome == 'failure'
              run: sleep 5

            - name: Publish build (attempt 2)
              id: publish_attempt_2
              if: steps.publish_attempt_1.outcome == 'failure'
              continue-on-error: true
              uses: dhis2/deploy-build@v1.18.4
              with:
                  build-dir: build
                  github-token: ${{ env.GH_TOKEN }}

            - name: Wait before final retry
              if: steps.publish_attempt_2.outcome == 'failure'
              run: sleep 10

            - name: Publish build (attempt 3)
              if: steps.publish_attempt_2.outcome == 'failure'
              uses: dhis2/deploy-build@v1.18.4
              with:
                  build-dir: build
                  github-token: ${{ env.GH_TOKEN }}

    release:
        runs-on: ubuntu-latest
        needs: [publish]
        if: "github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')"
        steps:
            - uses: actions/checkout@v4
              with:
                  token: ${{env.GH_TOKEN}}

            - uses: actions/setup-node@v4
              with:
                  node-version: 20.x

            - name: Publish release to GitHub
              run: npx @dhis2/cli-utils release
